name: CI/CD Flow

on:
  push:
    branches: 
        - develop

jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                node-version: 24
            - name: Check Project Structure and Verification
              run: |
                set -euo pipefail
                test -f package.json || echo "package.json not found" && exit 1
                test -f package-lock.json || echo "package-lock.json not found" && exit 1
                test -f vite.config.js || echo "vite.config.js not found" && exit 1
                test -d src || echo "src directory not found" && exit 1
                test -d src || echo "public directory not found" && exit 1
            - name: Install dependencies
              run: npm install
            - name: Run test 
              run: npx vitest
            - name: Build project
              run: npm run build
              



