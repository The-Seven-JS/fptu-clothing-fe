name: CI/CD with Docker

on:
  push:
    branches: 
        - develop

jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                node-version: 24
            - name: Check Project Structure and Verification
              run: |
                set -euo pipefail
                test -f package.json || (echo "package.json not found" && exit 1)
                test -f package-lock.json || (echo "package-lock.json not found" && exit 1)
                test -f vite.config.js || (echo "vite.config.js not found" && exit 1)
                test -d src || (echo "src directory not found" && exit 1)
                test -d public || (echo "public directory not found" && exit 1)
                if [ $? -eq 0 ]]; then
                  echo "Project structure verification done"
                  exit 0
                fi
            - name: Install dependencies
              run: npm ci
            - name: Run test 
              run: npx vitest
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_TOKEN }}
            - name: Build Docker image and Push
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: |
                    ${{ secrets.DOCKER_HUB_USERNAME }}/fptu-clothing-fe:latest
                    ${{ secrets.DOCKER_HUB_USERNAME }}/fptu-clothing-fe:${{ github.sha }}


    CD: 
        needs:
          - CI
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
            - name: Install Docker Engine and Compose V2
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.SERVER_HOST }}
                port: 22
                username: ${{ secrets.SERVER_USERNAME }}
                key: ${{ secrets.SERVER_KEY }}
                script: |
                  if ! command -v docker &> /dev/null; then
                    curl -fsSL https://get.docker.com -o get-docker.sh
                    sudo sh get-docker.sh
                    rm get-docker.sh
                    sudo systemctl start docker
                    sudo systemctl enable docker        
                  fi
                  if ! docker compose version &> /dev/null && ! command -v docker-compose &> /dev/null; then
                    sudo apt update -y
                    sudo apt install -y docker-compose-plugin
                  fi
                  
            - name: Copy docker-compose to server
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USERNAME }}
                key: ${{ secrets.SERVER_KEY }}
                source: "docker-compose.yml"
                target: "~/"
            
            - name: Run Docker Compose
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.SERVER_HOST }}
                port: 22
                username: ${{ secrets.SERVER_USERNAME }}
                key: ${{ secrets.SERVER_KEY }}
                script: |
                  cd ~
                  echo "${{ secrets.DOCKER_HUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
                  sudo docker compose pull
                  sudo docker compose up -d
                  sudo docker image prune -a -f







